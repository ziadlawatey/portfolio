<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- All CSS Files Links -->
    <link rel="stylesheet" href="styles/default.css" />
    <link rel="stylesheet" href="styles/styles.css" />

    <!-- JavaScript File Link -->
    <script src="src/darkmode.js" defer></script>

    <!-- Tab Icon -->
    <link
      rel="shortcut icon"
      href="assests/icons/white-scribble.png"
      type="image/x-icon"
    />

    <!-- Font Awesome -->
    <script
      src="https://kit.fontawesome.com/782ea87e27.js"
      crossorigin="anonymous"
    >
      document.documentElement.dataset.theme =
       localStorage.getItem("theme") ||
       (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    </script>

    <title>Ziad Lawatey</title>
  </head>
  <body class="dark-mode">
    <header>
      <div class="logo left-part">
        <image class="logo-icon" src="assests/icons/black-scribble.png"></image>
        <h1 class="logo-name">Ziad Lawatey</h1>
      </div>
      <div class="right-part">
        <div class="theme-switcher" role="group" aria-label="Theme">
          <button data-theme-choice="light" aria-label="Light mode">
            <i class="fa-solid fa-sun"></i>
          </button>
          <button data-theme-choice="dark" aria-label="Dark mode">
            <i class="fa-solid fa-moon"></i>
          </button>
        </div>
        <nav>
          <ul>
            <a href="#home">Home</a
            ><a href="#work">Work</a
            ><a href="#about">About</a>
          </ul>
        </nav>
      </div>
    </header>
    <main></main>
    <footer></footer>
  </body>
</html>
